name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly audit even with no code changes, to surface newly disclosed CVEs.
    - cron: "0 3 * * 1"

jobs:
  audit:
    name: npm audit + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit dependencies (fail on high/critical)
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
